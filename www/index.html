<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bola 22 Mágica</title>
  <meta name="description" content="Bola 22 Mágica - imita la bola mágica retro con modos y compartir" />
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg">
  <meta name="theme-color" content="#071022">
  <style>
    :root{--bg:#0b1220;--accent:#ffcc00;color:#fff}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#fff}
    body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:100vh}
    h1{margin:12px 0;font-size:1.4rem}
    #canvas-wrap{width:100%;height:48vh;display:flex;align-items:center;justify-content:center;position:relative}
    #canvas-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    canvas{display:block;width:100%;height:100%}
    .ui-container{width:100%;max-width:420px;padding:12px 18px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
    .mode-selector{display:flex;gap:6px;justify-content:space-between;background:rgba(255,255,255,0.02);padding:6px;border-radius:20px}
    .mode-btn{flex:1;padding:8px;border:0;background:transparent;color:#ddd;font-size:13px;font-weight:700;border-radius:14px;cursor:pointer}
    .mode-btn.active{background:#fff;color:#111}
    input{width:100%;padding:12px 16px;border-radius:25px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#fff;font-size:14px;text-align:center}
    .action-row{display:flex;gap:8px}
    .action-btn{flex:1;padding:12px;border-radius:20px;border:0;background:var(--accent);color:#111;font-weight:800;cursor:pointer}
    .share-btn{padding:10px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);color:#ddd;background:transparent;cursor:pointer}
    .hint{font-size:12px;color:#99a;text-align:center}
    footer{margin:10px 0 18px;font-size:12px;color:#99a}
    /* overlay to unlock audio */
    #startOverlay{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(3,6,10,0.6),rgba(3,6,10,0.2));z-index:50}
    #startOverlay button{background:var(--accent);border:none;padding:12px 20px;border-radius:18px;font-weight:800;color:#111}
  </style>
</head>
<body>
  <h1>BOLA 22 MÁGICA</h1>

  <div id="canvas-wrap">
    <div id="canvas-container" aria-hidden="true"></div>
    <div id="startOverlay"><button id="startBtn">Toca para iniciar</button></div>
  </div>

  <div class="ui-container">
    <div class="mode-selector" role="tablist" aria-label="Modos">
      <button class="mode-btn active" id="modeClassic">Clásico</button>
      <button class="mode-btn" id="modeSarcastic">Sarcástico</button>
      <button class="mode-btn" id="modeMystic">Místico</button>
      <button class="mode-btn" id="modeMotiv">Hype</button>
    </div>

    <input id="question" type="text" placeholder="Escribe tu pregunta de SÍ o NO..." />

    <div class="action-row">
      <button class="action-btn" id="askBtn">Agitar y Consultar</button>
      <button id="shareBtn" class="share-btn" style="display:none">Compartir</button>
    </div>

    <div class="hint">Arrastra para girar 360° · Cambia de modo para distintas vibras</div>
  </div>

  <footer>Hecha con Capacitor · Lista para compilar en Android</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // answer packs
  const answerPacks = {
    classic: ["ES CIERTO","SÍ TOTALMENTE","SIN DUDAS","CONFÍA EN ELLO","PARECE QUE SÍ","MUY PROBABLE","SÍ","NO"],
    sarcastic: ["¿EN SERIO?","NI LO SUEÑES","JAJAJA NO","OBVIO QUE NO","NO TE HAGAS ILUSIONES"],
    mystic: ["ALINEACIÓN A FAVOR","EL COSMOS DICE SÍ","DESTINO INCIERTO","ENERGÍA BLOQUEADA","SÍ, SE REVELA"],
    motiv: ["¡A POR ELLO!","¡SÍ O SÍ!","¡ROMPE EL LÍMITE!","¡CON TODO!","¡HOY SE LOGRA!"]
  };
  let currentMode = 'classic';
  let audioCtx = null;
  function initAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){ audioCtx=null; } }
  function playClick(){ if(!audioCtx) return; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(700,audioCtx.currentTime); o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.2,audioCtx.currentTime+0.02); o.start(); setTimeout(()=>{ g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12); setTimeout(()=>o.stop(),150); },80); }
  function playFluid(){ if(!audioCtx) return; const buf=audioCtx.createBuffer(1, audioCtx.sampleRate*0.35, audioCtx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*4);} const s=audioCtx.createBufferSource(); s.buffer=buf; const g=audioCtx.createGain(); g.gain.value=0.12; s.connect(g); g.connect(audioCtx.destination); s.start(); }
  function playImpact(){ if(!audioCtx) return; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(120,audioCtx.currentTime); o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.3,audioCtx.currentTime+0.02); o.start(); setTimeout(()=>{ g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.14); setTimeout(()=>o.stop(),160); },120); }

  function setMode(mode, btn){ currentMode = mode; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); try{ playClick(); }catch(e){} }

  function webglSupported(){ try{ const c=document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); }catch(e){return false;} }

  // boot after user taps
  window.addEventListener('load', ()=>{
    const overlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', ()=>{ initAudio(); overlay.style.display='none'; try{ initApp(); }catch(e){ console.error('initApp', e); } });
  });

  function initApp(){
    if(!webglSupported()){ document.getElementById('canvas-container').innerHTML = '<div style="color:#fff;padding:20px;text-align:center">Tu navegador no soporta WebGL. Prueba en Chrome/Edge.</div>'; return; }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / Math.max(container.clientHeight,200), 0.1, 1000);
    camera.position.z = 6;
    const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true, preserveDrawingBuffer:true});
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    container.innerHTML = '';
    container.appendChild(renderer.domElement);
    renderer.domElement.style.transform='none';
    renderer.domElement.style.width='100%'; renderer.domElement.style.height='100%';

    const amb = new THREE.AmbientLight(0xffffff,0.95); scene.add(amb);
    const dir = new THREE.DirectionalLight(0xffffff,0.8); dir.position.set(5,5,5); scene.add(dir);

    const ballGroup = new THREE.Group(); scene.add(ballGroup);
    const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(2,64,64), new THREE.MeshStandardMaterial({color:0x800020, roughness:0.1, metalness:0.2})); ballGroup.add(ballMesh);

    // 22 tag
    const canvas22 = document.createElement('canvas'); canvas22.width=512; canvas22.height=512; const ctx22 = canvas22.getContext('2d');
    function draw22(){ ctx22.clearRect(0,0,512,512); ctx22.fillStyle='#ffffff'; ctx22.beginPath(); ctx22.arc(256,256,200,0,Math.PI*2); ctx22.fill(); ctx22.fillStyle='#000000'; ctx22.font='Bold 220px Arial'; ctx22.textAlign='center'; ctx22.fillText('22',256,320); }
    draw22();
    const poolTag = new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(canvas22), transparent:true})); poolTag.position.set(0,0,2.01); ballGroup.add(poolTag);

    // window/frame and response triangle
    const windowGroup = new THREE.Group(); windowGroup.position.z = -2; windowGroup.rotation.y = Math.PI; ballGroup.add(windowGroup);
    const frameMesh = new THREE.Mesh(new THREE.RingGeometry(0.85,1.1,32), new THREE.MeshBasicMaterial({color:0x111111})); frameMesh.position.z=0.02; windowGroup.add(frameMesh);
    const glassMesh = new THREE.Mesh(new THREE.CircleGeometry(0.85,32), new THREE.MeshBasicMaterial({color:0x001a4d, transparent:true, opacity:0.85})); glassMesh.position.z=0.01; windowGroup.add(glassMesh);

    const responseCanvas = document.createElement('canvas'); responseCanvas.width=512; responseCanvas.height=512; const responseCtx = responseCanvas.getContext('2d'); const responseTexture = new THREE.CanvasTexture(responseCanvas);
    function updateResponseTexture(text){ responseCtx.clearRect(0,0,512,512); responseCtx.fillStyle='#0044ff'; responseCtx.beginPath(); responseCtx.moveTo(256,50); responseCtx.lineTo(460,410); responseCtx.lineTo(52,410); responseCtx.closePath(); responseCtx.fill(); responseCtx.strokeStyle='#66a3ff'; responseCtx.lineWidth=10; responseCtx.stroke(); responseCtx.fillStyle='#ffffff'; responseCtx.font='Bold 40px Arial'; responseCtx.textAlign='center'; responseCtx.textBaseline='middle'; const words=text.split(' '); if(words.length<=2){ responseCtx.fillText(text,256,290);} else { const mid=Math.ceil(words.length/2); responseCtx.fillText(words.slice(0,mid).join(' '),256,260); responseCtx.fillText(words.slice(mid).join(' '),256,320);} responseTexture.needsUpdate = true; }

    const triangleMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.3), new THREE.MeshBasicMaterial({map:responseTexture, transparent:true}));
    triangleMesh.position.set(0,0,0.05); triangleMesh.visible=false; windowGroup.add(triangleMesh);

    // state
    let isAnimating=false; let targetRotationY=0; let resetTimer=null; let restoreTimer=null; let lastAnswer='';

    function askOracle(){ const q=(document.getElementById('question').value||'').trim(); if(!q){ alert('Haz una pregunta primero.'); return; } if(isAnimating) return; isAnimating=true; document.getElementById('shareBtn').style.display='none'; try{ playClick(); }catch(e){} if(resetTimer) clearTimeout(resetTimer); if(restoreTimer) clearTimeout(restoreTimer); try{ playFluid(); if('vibrate' in navigator) navigator.vibrate([50,40,80]); }catch(e){} const pack = answerPacks[currentMode]||answerPacks.classic; lastAnswer = pack[Math.floor(Math.random()*pack.length)]; updateResponseTexture(lastAnswer); poolTag.visible=false; triangleMesh.visible=true; triangleMesh.material.map=responseTexture; triangleMesh.material.needsUpdate=true; targetRotationY=Math.PI; let startTime=performance.now(); function animateSeq(){ let elapsed=(performance.now()-startTime)/1000; if(elapsed<0.5){ ballGroup.rotation.z = Math.sin(elapsed*25)*0.05; requestAnimationFrame(animateSeq);} else if(elapsed<1.8){ let progress=(elapsed-0.5)/1.3; ballGroup.rotation.z = THREE.MathUtils.lerp(ballGroup.rotation.z,0,0.08); requestAnimationFrame(animateSeq);} else { ballGroup.rotation.z=0; isAnimating=false; document.getElementById('shareBtn').style.display='inline-block'; resetTimer=setTimeout(()=>{ targetRotationY=0; },3000);} } animateSeq(); restoreTimer=setTimeout(()=>{ triangleMesh.visible=false; poolTag.visible=true; updateResponseTexture('HAZ UNA PREGUNTA'); },10000); }

    document.getElementById('askBtn').addEventListener('click', askOracle);

    // share with fallback
    function shareResult(){ try{ const shareCanvas=document.createElement('canvas'); shareCanvas.width=1080; shareCanvas.height=1080; const sCtx=shareCanvas.getContext('2d'); sCtx.fillStyle='#08090c'; sCtx.fillRect(0,0,1080,1080); renderer.render(scene,camera); sCtx.drawImage(renderer.domElement,40,140,1000,800); sCtx.fillStyle='#ffffff'; sCtx.font='Bold 42px sans-serif'; sCtx.textAlign='center'; sCtx.fillText(`\"${document.getElementById('question').value||''}\"`,540,100); sCtx.fillStyle='#66a3ff'; sCtx.font='30px sans-serif'; sCtx.fillText(`Bola 22 Mágica • Modo ${currentMode.toUpperCase()}`,540,1020); shareCanvas.toBlob(blob=>{ if(!blob) return; const file=new File([blob],'bola22_respuesta.png',{type:'image/png'}); if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({title:'Mi respuesta de Bola 22',text:`Pregunté \"${document.getElementById('question').value||''}\"`,files:[file]}).catch(()=>{ downloadBlob(blob); }); } else { downloadBlob(blob); } },'image/png'); }catch(e){ console.error('share failed', e); } }
    function downloadBlob(blob){ const link=document.createElement('a'); link.download='bola22_respuesta.png'; link.href=URL.createObjectURL(blob); link.click(); setTimeout(()=>URL.revokeObjectURL(link.href),2000); }
    document.getElementById('shareBtn').addEventListener('click', shareResult);

    // pointer controls
    let isDragging=false; let prevMouse={x:0,y:0}; container.addEventListener('pointerdown',(e)=>{ initAudio(); if(resetTimer) clearTimeout(resetTimer); isDragging=true; prevMouse={x:e.clientX,y:e.clientY}; }); window.addEventListener('pointermove',(e)=>{ if(!isDragging || isAnimating) return; const dx=(e.clientX - prevMouse.x); const dy=(e.clientY - prevMouse.y); ballGroup.rotation.y += dx*0.01; ballGroup.rotation.x += dy*0.01; prevMouse={x:e.clientX,y:e.clientY}; }); window.addEventListener('pointerup',()=> isDragging=false);

    // animate
    function animate(){ requestAnimationFrame(animate); if(isAnimating){ ballGroup.rotation.y = THREE.MathUtils.lerp(ballGroup.rotation.y, targetRotationY, 0.08); } renderer.render(scene,camera); }
    updateResponseTexture('HAZ UNA PREGUNTA'); animate();

    window.addEventListener('resize',()=>{ camera.aspect = container.clientWidth / Math.max(container.clientHeight,200); camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });

    if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }

    // modes wiring
    document.getElementById('modeClassic').addEventListener('click', ()=>setMode('classic', document.getElementById('modeClassic')));
    document.getElementById('modeSarcastic').addEventListener('click', ()=>setMode('sarcastic', document.getElementById('modeSarcastic')));
    document.getElementById('modeMystic').addEventListener('click', ()=>setMode('mystic', document.getElementById('modeMystic')));
    document.getElementById('modeMotiv').addEventListener('click', ()=>setMode('motiv', document.getElementById('modeMotiv')));

    console.log('inedex initialized');
  }
  </script>
</body>
  </html>
