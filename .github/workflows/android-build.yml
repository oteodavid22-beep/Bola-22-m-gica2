name: Build Android AAB

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/share/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: |
          npm ci || npm install

      - name: Ensure Capacitor CLI is available
        run: |
          npm install @capacitor/cli @capacitor/core --no-save || true

      - name: Sync Capacitor (copy web to Android)
        run: |
          npx cap sync android

      - name: Setup Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK commandline tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Decode Android keystore (from secret)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/keystore.jks

      - name: Generate temporary keystore (if none provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          mkdir -p android/keystore
          KEYSTORE_PATH=android/keystore/keystore.jks
          KEY_ALIAS=temp_alias
          KEY_PASS=temp_pass
          STORE_PASS=temp_pass
          keytool -genkeypair -v -keystore $KEYSTORE_PATH -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 -storepass $STORE_PASS -keypass $KEY_PASS -dname "CN=Temp,O=Local,C=US"
          echo "TEMP_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "TEMP_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "TEMP_STORE_PASS=$STORE_PASS" >> $GITHUB_ENV

      - name: Build AAB (release)
        run: |
          cd android
          chmod +x ./gradlew
          if [ -f "keystore/keystore.jks" ]; then
            STORE_FILE=$PWD/keystore/keystore.jks
          else
            echo "Keystore not found"
            exit 1
          fi

          if [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            STORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          else
            STORE_PASS="$TEMP_STORE_PASS"
          fi
          if [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            KEY_ALIAS_VAL="${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            KEY_ALIAS_VAL="$TEMP_KEY_ALIAS"
          fi
          if [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            KEY_PASS_VAL="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            KEY_PASS_VAL="$TEMP_KEY_PASS"
          fi

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS_VAL" \
            -Pandroid.injected.signing.key.password="$KEY_PASS_VAL"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bola22-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Done
        run: echo "Build finished. Download the AAB from the workflow artifacts."
