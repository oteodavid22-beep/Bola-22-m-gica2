name: Build Android AAB

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.tool_cache }}/android-sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install npm dependencies
        run: |
          npm ci || npm install

      - name: Build web assets (if present)
        run: |
          npm run build --if-present

      - name: Ensure Capacitor CLI available
        run: |
          npm install @capacitor/cli @capacitor/core --no-save || true

      - name: Ensure Android platform exists (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder missing — adding Android platform..."
            npx cap add android || true
          else
            echo "Android folder exists"
          fi

      - name: Setup Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK (stable action)
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.2'
          cache: true

      - name: Prepare keystore (decode secret or generate temporary)
        run: |
          mkdir -p android/keystore
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/keystore.jks
            ls -l android/keystore/keystore.jks
          else
            echo "No keystore secret provided — generating temporary keystore for test build..."
            KEYSTORE_PATH=android/keystore/keystore.jks
            KEY_ALIAS=temp_alias
            KEY_PASS=temp_pass
            STORE_PASS=temp_pass
            keytool -genkeypair -v -keystore $KEYSTORE_PATH -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 -storepass $STORE_PASS -keypass $KEY_PASS -dname "CN=Temp,O=Local,C=US"
            echo "TEMP_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "TEMP_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
            echo "TEMP_STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
            ls -l android/keystore/keystore.jks
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build AAB (release)
        run: |
          cd android
          chmod +x ./gradlew
          if [ -f "keystore/keystore.jks" ]; then
            STORE_FILE=$PWD/keystore/keystore.jks
          else
            echo "Keystore not found"
            exit 1
          fi

          # choose credentials: prefer secrets, otherwise use generated temp values
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
          else
            STORE_PASS="$TEMP_STORE_PASS"
          fi

          if [ -n "$ANDROID_KEY_ALIAS" ]; then
            KEY_ALIAS_VAL="$ANDROID_KEY_ALIAS"
          else
            KEY_ALIAS_VAL="$TEMP_KEY_ALIAS"
          fi

          if [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEY_PASS_VAL="$ANDROID_KEY_PASSWORD"
          else
            KEY_PASS_VAL="$TEMP_KEY_PASS"
          fi

          echo "Using keystore: $STORE_FILE"
          echo "Using alias: $KEY_ALIAS_VAL"

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS_VAL" \
            -Pandroid.injected.signing.key.password="$KEY_PASS_VAL"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bola22-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Done
        run: echo "Build finished. Download the AAB from the workflow artifacts."
